<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
  <title id="title">Profile photo placeholder</title>
  <desc id="description">Replace this image with your own square profile photo.</desc>
  <defs>
