      <stop offset="0" stop-color="#f6eee5" />
      <stop offset="1" stop-color="#e9ded1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="300" fill="url(#background)" />
  <circle cx="300" cy="230" r="104" fill="#b8a79a" />
